[project]
name = "sosho-graph"
version = "0.1.0"
description = "Sosho graph service. Compiles Studio graph JSON into LangGraph runs."
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiosqlite==0.22.1",
  "fastapi==0.165.0",
  "langchain-core==1.8.4",
  "langchain-openai==1.8.5",
  "langfuse==5.2.0",
  "langgraph==1.2.24",
  "langgraph-checkpoint-sqlite==3.1.3",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sosho_graph"]
