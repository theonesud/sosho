[project]
name = "sosho-engine"
version = "0.1.0"
description = "Sosho durable workflow engine on DBOS Transact."
requires-python = ">=3.13,<3.14"
dependencies = [
  "croniter==7.0.0",
  "dbos==3.7.0",
  "fastapi==0.165.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.9",
  "pydantic==2.14.4",
  "pydantic-ai==2.74.0",
  "pydantic-settings==2.16.3",
  "sqlalchemy==2.1.9",
  "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sosho_engine"]
