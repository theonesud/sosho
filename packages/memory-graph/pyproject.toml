[project]
name = "sosho-memory"
version = "0.1.0"
description = "Sosho graph memory layer on SurrealDB 4.0 with SurrealKV."
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx==0.28.1",
  "networkx==3.7",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "surrealdb[embedded]==3.0.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sosho_memory"]
