# Vale checks prose against ASD-STE100 rules. All rules warn. Vale never blocks.
# The local style in .vale/styles/STE needs no network package.
# packages/llm, packages/memory, packages/workflow-engine, and packages/yue2 are pending review.
# Legacy Markdown in legacy/ gets no style. The rebuild stages remove it from this list.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = STE

[usecases.md]
BasedOnStyles =

[{legacy,apps,workflows,packages/llm,packages/memory,packages/workflow-engine,packages/yue2,.pi,.agents/skills,models}/**/*.md]
BasedOnStyles =
