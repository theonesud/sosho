# Vale checks prose against ASD-STE100 rules. All rules warn. Vale never blocks.
# The local style in .vale/styles/STE needs no network package.
# Legacy Markdown paths get no style. The rebuild stages remove them from this list.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = STE

[{readme,PRODUCT,DESIGN,REFACTOR_PLAN,model_params,usecases}.md]
BasedOnStyles =

[{apps,packages,yue2,workflows,tests,docker,.pi,.agents/skills,.impeccable,models,docs/context}/**/*.md]
BasedOnStyles =
