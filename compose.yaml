# Sosho Docker services.
#
# Always-on services: llama-cpp (GPU chat plus CPU decision and embed models), litellm,
# graph, langflow, and the Langfuse stack (included below).
# Optional services: yue2-* under the `music` profile.
#
# Usage:
#   docker compose -p sosho up -d                   # always-on services
#   docker compose -p sosho --profile music up -d   # add YuE2 music services
#   docker compose -p sosho logs -f llama-cpp
#
# Host-specific values and secrets live in .env (see .env.example).
# Every host port binds to 127.0.0.1.

name: sosho

include:
  - path: docker/compose.langfuse.yaml

x-model: &model
  HF_REPO: HauhauCS/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive
  MODEL_SUBDIR: Qwen3.6-35B-A3B
  MODEL_FILE: Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q5_K_P.gguf
  MMPROJ_FILE: mmproj-Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-f16.gguf

services:
  # One-shot download job for the main model. Skips when both files exist.
  # Files: ./models/Qwen3.6-35B-A3B/<MODEL_FILE> and ./models/Qwen3.6-35B-A3B/<MMPROJ_FILE>
  model-download:
    image: python:3.12.15-slim
    networks: [sosho-net]
    environment:
      <<: *model
      HF_XET_HIGH_PERFORMANCE: "1"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./models:/models
      - hf-cache:/root/.cache/huggingface
    command:
      - sh
      - -c
      - |
        set -e
        dir=/models/$$MODEL_SUBDIR
        if [ -e "$$dir/$$MODEL_FILE" ] && [ -e "$$dir/$$MMPROJ_FILE" ]; then
          echo "Models present in $$dir"; exit 0
        fi
        pip install -q --root-user-action=ignore --retries 10 --timeout 60 "huggingface_hub[cli,hf_xet]==2.4.0"
        hf download "$$HF_REPO" "$$MODEL_FILE" "$$MMPROJ_FILE" --local-dir "$$dir"
    restart: "no"

  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b12407
    container_name: llama-cpp
    restart: always
    depends_on:
      model-download:
        condition: service_completed_successfully
      decision-model-download:
        condition: service_completed_successfully
      embed-model-download:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    networks: [sosho-net]
    ipc: host
    cpu_shares: 256
    ulimits:
      memlock: { soft: -1, hard: -1 }
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - ./models:/models:ro
      - ./docker/llama-models.ini:/etc/llama/models.ini:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --models-preset
      - /etc/llama/models.ini
      - --models-max
      - "3"
      - --host
      - 0.0.0.0
      - --port
      - "8080"

  # CPU decision model download. Served by llama-cpp router preset [Qwen3-1.7B].
  # File: ./models/Qwen3-1.7B/Qwen3-1.7B-Q4_K_M.gguf
  decision-model-download:
    image: python:3.12.15-slim
    networks: [sosho-net]
    environment:
      HF_REPO: unsloth/Qwen3-1.7B-GGUF
      MODEL_SUBDIR: Qwen3-1.7B
      MODEL_FILE: Qwen3-1.7B-Q4_K_M.gguf
      HF_XET_HIGH_PERFORMANCE: "1"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./models:/models
      - hf-cache:/root/.cache/huggingface
    command:
      - sh
      - -c
      - |
        set -e
        dir=/models/$$MODEL_SUBDIR
        if [ -e "$$dir/$$MODEL_FILE" ]; then
          echo "Decision model present in $$dir"; exit 0
        fi
        pip install -q --root-user-action=ignore --retries 10 --timeout 60 "huggingface_hub[cli,hf_xet]==2.4.0"
        hf download "$$HF_REPO" "$$MODEL_FILE" --local-dir "$$dir"
    restart: "no"

  # CPU embedding model download. Served by llama-cpp router preset [embeddinggemma].
  # File: ./models/embeddinggemma-300M/embeddinggemma-300M-Q8_0.gguf
  embed-model-download:
    image: python:3.12.15-slim
    networks: [sosho-net]
    environment:
      HF_REPO: ggml-org/embeddinggemma-300M-GGUF
      MODEL_SUBDIR: embeddinggemma-300M
      MODEL_FILE: embeddinggemma-300M-Q8_0.gguf
      HF_XET_HIGH_PERFORMANCE: "1"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./models:/models
      - hf-cache:/root/.cache/huggingface
    command:
      - sh
      - -c
      - |
        set -e
        dir=/models/$$MODEL_SUBDIR
        if [ -e "$$dir/$$MODEL_FILE" ]; then
          echo "Embedding model present in $$dir"; exit 0
        fi
        pip install -q --root-user-action=ignore --retries 10 --timeout 60 "huggingface_hub[cli,hf_xet]==2.4.0"
        hf download "$$HF_REPO" "$$MODEL_FILE" --local-dir "$$dir"
    restart: "no"

  # LiteLLM gateway. llama-cpp uses service_started, because yue2 can unload it.
  litellm:
    image: ghcr.io/berriai/litellm:v1.110.2
    container_name: litellm
    restart: unless-stopped
    depends_on:
      llama-cpp:
        condition: service_started
    ports:
      - "127.0.0.1:4000:4000"
    networks: [sosho-net]
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-sosho-local}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      REFUSELESS_API_KEY: ${REFUSELESS_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local-pi}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local-pi}
      LANGFUSE_HOST: http://langfuse-web:3000
    healthcheck:
      # The LiteLLM image has no curl. Python is present.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # YuE2 model download: GGUF weights and sidecars, once. Skips when all files exist.
  # Files: ./models/yue2-3b/yue2-3b-q4_0.gguf, ./models/yue2-3b/yue2-vae-f16.gguf,
  #        ./models/yue2-3b/sidecars/{yue2-model-config.json,yue2-generation-config.json,
  #        yue2-vae-config.json,yue2-qwen.tiktoken}
  yue2-model-download:
    profiles: [music]
    image: python:3.12.15-slim
    networks: [sosho-net]
    environment:
      HF_REPO: audio-cpp/Yue2-3B-GGUF
      HF_XET_HIGH_PERFORMANCE: "1"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./models/yue2-3b:/models
      - hf-cache:/root/.cache/huggingface
    command:
      - sh
      - -c
      - |
        set -e
        need="yue2-3b-q4_0.gguf yue2-vae-f16.gguf \
              sidecars/yue2-model-config.json sidecars/yue2-generation-config.json \
              sidecars/yue2-vae-config.json sidecars/yue2-qwen.tiktoken"
        missing=0
        for f in $$need; do [ -e "/models/$$f" ] || missing=1; done
        if [ $$missing -eq 0 ]; then
          echo "YuE2 models present in /models"; exit 0
        fi
        pip install -q --root-user-action=ignore --retries 10 --timeout 60 "huggingface_hub[cli,hf_xet]==2.4.0"
        hf download "$$HF_REPO" $$need --local-dir /models
    restart: "no"

  # YuE2 engine: one resident model, offline generation only.
  # Start with: docker compose -p sosho --profile music up -d
  yue2-engine:
    profiles: [music]
    image: ghcr.io/0xshug0/audio.cpp:full-cuda12-20261122-337af0c
    container_name: yue2-engine
    restart: "no"
    depends_on:
      yue2-model-download:
        condition: service_completed_successfully
    networks: [sosho-net]
    ipc: host
    cpu_shares: 512
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - ./models/yue2-3b:/models:ro
      - ./packages/yue2/server.json:/app/server.json:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - server
      - --config
      - /app/server.json
      - --host
      - 0.0.0.0
      - --port
      - "8020"
      - --backend
      - cuda
      - --log

  # Async job API in front of the engine (202 + id, poll, FLAC/ABC download).
  yue2-gateway:
    profiles: [music]
    build:
      context: .
      dockerfile: docker/Dockerfile.yue2-gateway
    image: yue2-gateway:latest
    pull_policy: build
    container_name: yue2-gateway
    restart: unless-stopped
    depends_on:
      - yue2-engine
    ports:
      - "127.0.0.1:8021:8000"
    networks: [sosho-net]
    environment:
      YUE2_ENGINE_URL: http://yue2-engine:8020
      YUE2_MODEL_ID: yue2
      YUE2_DATA_DIR: /data
      YUE2_API_KEY: ${YUE2_API_KEY:-}
      YUE2_MAX_PENDING: ${YUE2_MAX_PENDING:-4}
      YUE2_UNLOAD_AFTER_JOB: ${YUE2_UNLOAD_AFTER_JOB:-true}
      YUE2_RETENTION_SECONDS: ${YUE2_RETENTION_SECONDS:-86400}
      YUE2_MAX_GIB: ${YUE2_MAX_GIB:-5}
      # VRAM handshake: unload active models via the llama-cpp HTTP API (no Docker socket).
      YUE2_STOP_LLAMA: ${YUE2_STOP_LLAMA:-true}
      YUE2_LLAMA_URL: http://llama-cpp:8080
      YUE2_BIND_HOST: 127.0.0.1
    volumes:
      - ./yue2-data:/data

  # Graph service. Compiles Studio graph JSON into LangGraph runs. Open source library, no license key.
  # Build: docker/Dockerfile.graph. Checkpoints live in the graph-data volume.
  graph:
    build:
      context: .
      dockerfile: docker/Dockerfile.graph
    image: sosho-graph:latest
    pull_policy: build
    container_name: sosho-graph
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_started
    ports:
      - "127.0.0.1:8123:8123"
    networks: [sosho-net]
    environment:
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-sosho-local}
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local-pi}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local-pi}
    volumes:
      - graph-data:/data

  langflow:
    image: langflowai/langflow:1.13.3
    container_name: langflow
    restart: unless-stopped
    ports:
      - "127.0.0.1:7860:7860"
    networks: [sosho-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LANGFLOW_HOST: 0.0.0.0
      LANGFLOW_PORT: "7860"
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER:-admin}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD:-sosho-local}
      OPENAI_API_BASE: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-sosho-local}
      SOSHO_STUDIO_API_URL: http://host.docker.internal:4101
    volumes:
      - langflow-data:/app/langflow
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:7860/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

networks:
  sosho-net:
    name: sosho-net

volumes:
  hf-cache:
  langflow-data:
  graph-data:
