name: sosho

include:
  - path: docker/compose.langfuse.yaml

services:
  model-download:
    image: python:3.13.18-slim-trixie
    networks: [sosho-net]
    environment:
      HF_XET_HIGH_PERFORMANCE: "1"
      HF_TOKEN: ${HF_TOKEN:-}
      MODELS: |
        HauhauCS/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive Qwen3.6-35B-A3B Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q5_K_P.gguf mmproj-Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-f16.gguf
        unsloth/Qwen3-1.7B-GGUF Qwen3-1.7B Qwen3-1.7B-Q4_K_M.gguf
        ggml-org/embeddinggemma-300M-GGUF embeddinggemma-300M embeddinggemma-300M-Q8_0.gguf
    volumes:
      - ./models:/models
      - hf-cache:/root/.cache/huggingface
    command:
      - sh
      - -c
      - |
        set -e
        printf '%s\n' "$$MODELS" | while read -r repo subdir files; do
          [ -n "$$repo" ] || continue
          missing=0
          for f in $$files; do [ -e "/models/$$subdir/$$f" ] || missing=1; done
          if [ $$missing -eq 0 ]; then echo "Present: $$subdir"; continue; fi
          command -v hf >/dev/null || pip install -q --root-user-action=ignore --retries 10 --timeout 60 "huggingface_hub[cli,hf_xet]==2.4.0"
          hf download "$$repo" $$files --local-dir "/models/$$subdir"
        done
    restart: "no"

  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b12407
    container_name: llama-cpp
    restart: unless-stopped
    depends_on:
      model-download:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    networks: [sosho-net]
    ipc: host
    cpu_shares: 256
    ulimits:
      memlock: { soft: -1, hard: -1 }
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - ./models:/models:ro
      - ./docker/llama-models.ini:/etc/llama/models.ini:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --models-preset
      - /etc/llama/models.ini
      - --models-max
      - "3"
      - --host
      - 0.0.0.0
      - --port
      - "8080"

  litellm:
    image: ghcr.io/berriai/litellm:v1.110.2
    container_name: litellm
    restart: unless-stopped
    mem_limit: 1g
    security_opt: [no-new-privileges:true]
    depends_on:
      llama-cpp:
        # llama-cpp uses service_started, because yue2 can unload it.
        condition: service_started
    ports:
      - "127.0.0.1:4000:4000"
    networks: [sosho-net]
    volumes:
      - ./docker/litellm.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Run make setup to create it}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      REFUSELESS_API_KEY: ${REFUSELESS_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Run make setup to create it}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Run make setup to create it}
      LANGFUSE_HOST: http://langfuse-web:3000
    healthcheck:
      # The LiteLLM image has no curl. Python is present.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  yue2-model-download:
    profiles: [music]
    image: python:3.13.18-slim-trixie
    networks: [sosho-net]
    environment:
      HF_REPO: audio-cpp/Yue2-3B-GGUF
      HF_XET_HIGH_PERFORMANCE: "1"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./models/yue2-3b:/models
      - hf-cache:/root/.cache/huggingface
    command:
      - sh
      - -c
      - |
        set -e
        need="yue2-3b-q4_0.gguf yue2-vae-f16.gguf \
              sidecars/yue2-model-config.json sidecars/yue2-generation-config.json \
              sidecars/yue2-vae-config.json sidecars/yue2-qwen.tiktoken"
        missing=0
        for f in $$need; do [ -e "/models/$$f" ] || missing=1; done
        if [ $$missing -eq 0 ]; then
          echo "YuE2 models present in /models"; exit 0
        fi
        pip install -q --root-user-action=ignore --retries 10 --timeout 60 "huggingface_hub[cli,hf_xet]==2.4.0"
        hf download "$$HF_REPO" $$need --local-dir /models
    restart: "no"

  yue2-engine:
    profiles: [music]
    image: ghcr.io/0xshug0/audio.cpp:full-cuda12-20261122-337af0c
    container_name: yue2-engine
    restart: "no"
    depends_on:
      yue2-model-download:
        condition: service_completed_successfully
    networks: [sosho-net]
    ipc: host
    cpu_shares: 512
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - ./models/yue2-3b:/models:ro
      - ./packages/yue2/server.json:/app/server.json:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - server
      - --config
      - /app/server.json
      - --host
      - 0.0.0.0
      - --port
      - "8020"
      - --backend
      - cuda
      - --log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8020/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s

  yue2-gateway:
    profiles: [music]
    build:
      context: .
      dockerfile: docker/Dockerfile.yue2-gateway
    image: yue2-gateway:latest
    pull_policy: build
    container_name: yue2-gateway
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    depends_on:
      yue2-engine:
        condition: service_healthy
    ports:
      - "127.0.0.1:8021:8000"
    networks: [sosho-net]
    environment:
      YUE2_ENGINE_URL: http://yue2-engine:8020
      YUE2_MODEL_ID: yue2
      YUE2_DATA_DIR: /data
      YUE2_API_KEY: ${YUE2_API_KEY:-}
      YUE2_MAX_PENDING: ${YUE2_MAX_PENDING:-4}
      YUE2_UNLOAD_AFTER_JOB: ${YUE2_UNLOAD_AFTER_JOB:-true}
      YUE2_RETENTION_SECONDS: ${YUE2_RETENTION_SECONDS:-86400}
      YUE2_MAX_GIB: ${YUE2_MAX_GIB:-5}
      YUE2_STOP_LLAMA: ${YUE2_STOP_LLAMA:-true}
      YUE2_LLAMA_URL: http://llama-cpp:8080
      YUE2_BIND_HOST: 127.0.0.1
    volumes:
      - yue2-data:/data

  graph:
    build:
      context: .
      dockerfile: docker/Dockerfile.graph
    image: sosho-graph:latest
    pull_policy: build
    container_name: sosho-graph
    restart: unless-stopped
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      litellm:
        condition: service_healthy
    ports:
      - "127.0.0.1:8123:8123"
    networks: [sosho-net]
    environment:
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:?Run make setup to create it}
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Run make setup to create it}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Run make setup to create it}
    volumes:
      - graph-data:/data

  langflow:
    image: langflowai/langflow:1.13.3
    container_name: langflow
    restart: unless-stopped
    mem_limit: 2560m
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:7860:7860"
    networks: [sosho-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LANGFLOW_HOST: 0.0.0.0
      LANGFLOW_PORT: "7860"
      LANGFLOW_AUTO_LOGIN: "false"
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER:-admin}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD:?Run make setup to create it}
      OPENAI_API_BASE: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:?Run make setup to create it}
      SOSHO_STUDIO_API_URL: http://host.docker.internal:4101
    volumes:
      - langflow-data:/app/langflow
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:7860/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

networks:
  sosho-net:
    name: sosho-net

volumes:
  hf-cache:
  langflow-data:
  graph-data:
  yue2-data:
