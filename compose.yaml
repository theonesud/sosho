# Usage:
#   docker compose --profile llm up -d   # starts llama-cpp + langfuse stack
#   docker compose run --rm pi           # interactive pi agent in this workspace
#   docker compose logs -f llama-cpp
#
# Host-specific values (UID/GID/HOME/threads) live in .env

name: sosho

include:
  - path: docker/compose.langfuse.yaml


x-model: &model
  HF_REPO: HauhauCS/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive
  MODEL_SUBDIR: Qwen3.6-35B-A3B
  MODEL_FILE: Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q5_K_P.gguf
  MMPROJ_FILE: mmproj-Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-f16.gguf

services:
  # One-shot init job: fetches the GGUFs if missing, then exits.
  model-download:
    profiles: [llm]
    image: python:3.12-slim
    environment:
      <<: *model
      HF_XET_HIGH_PERFORMANCE: "1"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./models:/models
      - hf-cache:/root/.cache/huggingface
    command:
      - sh
      - -c
      - |
        set -e
        dir=/models/$$MODEL_SUBDIR
        if [ -e "$$dir/$$MODEL_FILE" ] && [ -e "$$dir/$$MMPROJ_FILE" ]; then
          echo "Models present in $$dir"; exit 0
        fi
        pip install -q --root-user-action=ignore --retries 10 --timeout 60 "huggingface_hub[cli,hf_xet]"
        hf download "$$HF_REPO" "$$MODEL_FILE" "$$MMPROJ_FILE" --local-dir "$$dir"
    restart: "no"

  llama-cpp:
    profiles: [llm]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp
    restart: always
    depends_on:
      model-download:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    networks: [webui-net]
    ipc: host
    cpu_shares: 256
    ulimits:
      memlock: { soft: -1, hard: -1 }
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - ./models/Qwen3.6-35B-A3B:/models/Qwen3.6-35B-A3B:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --models-dir
      - /models
      - --models-max
      - "1"
      - --host
      - 0.0.0.0
      - -cmoe
      - --moe-cache-mib
      - "${LLM_MOE_CACHE_MIB:-1536}"
      - -lm
      - "${LLM_LOAD_MODE:-mlock}"
      - --image-min-tokens
      - "1024"
      - -c
      - "${LLM_CTX_SIZE:-65536}"
      - -n
      - "-1"
      - -np
      - "1"
      - -t
      - ${LLM_THREADS:-8}
      - -ctk
      - "${LLM_KV_CACHE_TYPE:-q4_0}"
      - -ctv
      - "${LLM_KV_CACHE_TYPE:-q4_0}"
      - -b
      - "${LLM_BATCH:-2048}"
      - -ub
      - "${LLM_UBATCH:-512}"
      - -tb
      - ${LLM_THREADS_BATCH:-12}
      - --cache-prompt
      - --reasoning
      - "on"
      - --reasoning-preserve
      - --sleep-idle-seconds
      - "900"
      - -fa
      - "on"

  # Lightweight CPU-only decision/router model (0 GPU VRAM, ~1.5 GB RAM).
  # Start with: docker compose --profile decision up -d
  decision-model-download:
    profiles: [decision]
    image: python:3.12-slim
    environment:
      HF_REPO: unsloth/Qwen3-1.7B-GGUF
      MODEL_SUBDIR: Qwen3-1.7B
      MODEL_FILE: Qwen3-1.7B-Q4_K_M.gguf
      HF_XET_HIGH_PERFORMANCE: "1"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./models:/models
      - hf-cache:/root/.cache/huggingface
    command:
      - sh
      - -c
      - |
        set -e
        dir=/models/$$MODEL_SUBDIR
        if [ -e "$$dir/$$MODEL_FILE" ]; then
          echo "Decision model present in $$dir"; exit 0
        fi
        pip install -q --root-user-action=ignore --retries 10 --timeout 60 "huggingface_hub[cli,hf_xet]"
        hf download "$$HF_REPO" "$$MODEL_FILE" --local-dir "$$dir"
    restart: "no"

  llama-decision:
    profiles: [decision]
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-decision
    restart: unless-stopped
    depends_on:
      decision-model-download:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8081:8081"
    networks: [webui-net]
    volumes:
      - ./models/Qwen3-1.7B:/models/Qwen3-1.7B:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    command:
      - -m
      - /models/Qwen3-1.7B/Qwen3-1.7B-Q4_K_M.gguf
      - --alias
      - Qwen3-1.7B
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - -c
      - "16384"
      - -np
      - "4"
      - -t
      - "${DECISION_LLM_THREADS:-8}"
      - --cache-prompt

  # Lightweight CPU-only embedding model for memory vector recall (0 GPU VRAM, ~400 MB RAM).
  embed-model-download:
    profiles: [embed]
    image: python:3.12-slim
    environment:
      HF_REPO: ggml-org/embeddinggemma-300M-GGUF
      MODEL_SUBDIR: embeddinggemma-300M
      MODEL_FILE: embeddinggemma-300M-Q8_0.gguf
      HF_XET_HIGH_PERFORMANCE: "1"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./models:/models
      - hf-cache:/root/.cache/huggingface
    command:
      - sh
      - -c
      - |
        set -e
        dir=/models/$$MODEL_SUBDIR
        if [ -e "$$dir/$$MODEL_FILE" ]; then
          echo "Embedding model present in $$dir"; exit 0
        fi
        pip install -q --root-user-action=ignore --retries 10 --timeout 60 "huggingface_hub[cli,hf_xet]"
        hf download "$$HF_REPO" "$$MODEL_FILE" --local-dir "$$dir"
    restart: "no"

  llama-embed:
    profiles: [embed]
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-embed
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      embed-model-download:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8082:8082"
    networks: [webui-net]
    volumes:
      - ./models/embeddinggemma-300M:/models/embeddinggemma-300M:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8082/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    command:
      - -m
      - /models/embeddinggemma-300M/embeddinggemma-300M-Q8_0.gguf
      - --alias
      - embeddinggemma
      - --embeddings
      - --pooling
      - mean
      - --host
      - 0.0.0.0
      - --port
      - "8082"
      - -c
      - "2048"
      - -np
      - "4"
      - -t
      - "${EMBED_LLM_THREADS:-4}"



  # YuE2 model fetch: GGUF weights + sidecars from Hugging Face, once.
  # Skips entirely when the files are already present.
  yue2-model-download:
    profiles: [music]
    image: python:3.12-slim
    environment:
      HF_REPO: audio-cpp/Yue2-3B-GGUF
      HF_XET_HIGH_PERFORMANCE: "1"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${YUE2_MODELS_DIR:-./models/yue2-3b}:/models
      - hf-cache:/root/.cache/huggingface
    command:
      - sh
      - -c
      - |
        set -e
        need="yue2-3b-q4_0.gguf yue2-vae-f16.gguf \
              sidecars/yue2-model-config.json sidecars/yue2-generation-config.json \
              sidecars/yue2-vae-config.json sidecars/yue2-qwen.tiktoken"
        missing=0
        for f in $$need; do [ -e "/models/$$f" ] || missing=1; done
        if [ $$missing -eq 0 ]; then
          echo "YuE2 models present in /models"; exit 0
        fi
        pip install -q --root-user-action=ignore --retries 10 --timeout 60 "huggingface_hub[cli,hf_xet]"
        hf download "$$HF_REPO" $$need --local-dir /models
    restart: "no"

  # YuE2 engine: one resident model, offline generation only.
  # Not started by `up` (profile `music`) because it needs ~6 GB free VRAM.
  #   docker compose --profile music up -d
  yue2-engine:
    profiles: [music]
    image: ghcr.io/0xshug0/audio.cpp:full-cuda12
    container_name: yue2-engine
    restart: "no"
    depends_on:
      yue2-model-download:
        condition: service_completed_successfully
    networks: [webui-net]
    ipc: host
    cpu_shares: 512
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - ${YUE2_MODELS_DIR:-./models/yue2-3b}:/models:ro
      - ./yue2/server.json:/app/server.json:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - server
      - --config
      - /app/server.json
      - --host
      - 0.0.0.0
      - --port
      - "8020"
      - --backend
      - cuda
      - --log

  # Async job API in front of the engine (202 + id, poll, FLAC/ABC download).
  yue2-gateway:
    profiles: [music]
    build:
      context: .
      dockerfile: docker/Dockerfile.yue2-gateway
    image: yue2-gateway:latest
    pull_policy: build
    container_name: yue2-gateway
    restart: unless-stopped
    depends_on:
      - yue2-engine
    ports:
      - "127.0.0.1:${YUE2_GATEWAY_PORT:-8021}:8000"
    networks: [webui-net]
    environment:
      YUE2_ENGINE_URL: http://yue2-engine:8020
      YUE2_MODEL_ID: yue2
      YUE2_DATA_DIR: /data
      YUE2_API_KEY: ${YUE2_API_KEY:-}
      YUE2_MAX_PENDING: ${YUE2_MAX_PENDING:-4}
      YUE2_UNLOAD_AFTER_JOB: ${YUE2_UNLOAD_AFTER_JOB:-true}
      YUE2_RETENTION_SECONDS: ${YUE2_RETENTION_SECONDS:-86400}
      YUE2_MAX_GIB: ${YUE2_MAX_GIB:-5}
      # VRAM handshake: unload active models via llama-cpp HTTP API (no Docker socket needed).
      YUE2_STOP_LLAMA: ${YUE2_STOP_LLAMA:-true}
      YUE2_LLAMA_URL: ${YUE2_LLAMA_URL:-http://llama-cpp:8080}
      YUE2_BIND_HOST: ${YUE2_BIND_HOST:-127.0.0.1}
    volumes:
      - ./yue2-data:/data

  # Interactive agent; not started by `up` (profile), use `docker compose run --rm pi`.
  pi:
    profiles: [agent]
    build:
      context: .
      dockerfile: docker/Dockerfile.pi
    image: pi-sandbox:latest
    container_name: pi-agent
    network_mode: host
    pid: host
    user: "${UID:-1000}:${GID:-1000}"
    stdin_open: true
    tty: true
    working_dir: ${PWD}
    environment:
      HOME: ${HOME}
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://127.0.0.1:8080}
      PI_CODING_AGENT_DIR: ${PWD}/.pi
      XDG_CACHE_HOME: ${PWD}/.pi/.cache
      XDG_CONFIG_HOME: ${PWD}/.pi/.config
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://127.0.0.1:3001}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local-pi}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local-pi}
      YUE2_GATEWAY_URL: ${YUE2_GATEWAY_URL:-http://127.0.0.1:8021}
      YUE2_API_KEY: ${YUE2_API_KEY:-}
    tmpfs:
      - ${HOME}:uid=${UID:-1000},gid=${GID:-1000},mode=0755
    volumes:
      - ${PWD}:${PWD}
      - ${PWD}/../worktrees:${PWD}/../worktrees
      - ${HOME}/.dokobot:${HOME}/.dokobot
      - ${HOME}/.sosho/memory:${HOME}/.sosho/memory
      - ${HOME}/skills:${HOME}/skills:ro
      - ${HOME}/.gitconfig:${HOME}/.gitconfig:ro
    command: ["--approve"]

networks:
  webui-net:
    name: webui-net

volumes:
  hf-cache:
