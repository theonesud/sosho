# lefthook 2 reads `exclude` as a list of globs. A regex string has no effect.
x-legacy: &legacy
  - "legacy/**"
  - "packages/memory/**"
  - "packages/yue2/**"
  - "docker/Dockerfile.yue2-gateway"
  - ".pi/**"
  - ".agents/skills/**"
  - "models/**"
  - "skills-lock.json"

x-legacy-docs: &legacy-docs
  - "legacy/**"
  - "packages/memory/**"
  - "packages/yue2/**"
  - ".pi/**"
  - ".agents/skills/**"
  - "models/**"
  - "docs/usecases.md"

output:
  - failure

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc}"
      exclude: *legacy
      run: mise exec -- pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    ruff-format:
      glob: "*.py"
      exclude: *legacy
      run: mise exec -- uv run ruff format {staged_files}
      stage_fixed: true
    ruff-lint:
      glob: "*.py"
      exclude: *legacy
      run: mise exec -- uv run ruff check --fix {staged_files}
      stage_fixed: true
    shfmt:
      glob: "*.sh"
      exclude: *legacy
      run: mise exec -- shfmt -w -i 2 -ci {staged_files}
      stage_fixed: true
    shellcheck:
      glob: "*.sh"
      exclude: *legacy
      run: mise exec -- shellcheck -x {staged_files}
    hadolint:
      glob: "{Dockerfile,Dockerfile.*,*.Dockerfile,*/Dockerfile,*/Dockerfile.*}"
      exclude: *legacy
      run: mise exec -- hadolint {staged_files}
    taplo:
      glob: "*.toml"
      exclude: *legacy
      run: mise exec -- taplo fmt {staged_files}
      stage_fixed: true
    gitleaks:
      # Secrets scanning covers every path, legacy paths included.
      run: mise exec -- gitleaks git --staged --no-banner --redact
    vale:
      glob: "*.md"
      exclude: *legacy-docs
      run: mise exec -- vale --config .config/vale/vale.ini --no-exit {staged_files}
      fail_text: "Vale reported warnings. The commit continues."

commit-msg:
  commands:
    conventional:
      run: sh bin/check-commit-msg.sh {1}
    vale:
      run: mise exec -- vale --config .config/vale/vale.ini --no-exit --ext=.md {1} || true

pre-push:
  commands:
    test:
      run: mise exec -- make test-fast
