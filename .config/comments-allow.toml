[[comment]]
path = "compose.yaml"
text = "# The LiteLLM image has no curl. Python is present."
reason = "A curl healthcheck fails in this image and marks a working LiteLLM as unhealthy."

[[comment]]
path = ".config/mise.toml"
text = "# Python 3.13 is the newest version that both LangGraph and Langflow list as supported."
reason = "The newest-version rule invites a bump to Python 3.14, which these libraries do not support."

[[comment]]
path = ".config/lefthook.yml"
text = "# lefthook 2 reads `exclude` as a list of globs. A regex string has no effect."
reason = "A lefthook defect makes a regex exclude silently do nothing, so a reader would think the files are excluded."

[[comment]]
path = ".config/lefthook.yml"
text = "# Secrets scanning covers every path, legacy paths included."
reason = "A reader would copy the legacy exclude list to gitleaks and stop the secret scan of legacy files."

[[comment]]
path = "docker/llama-models.ini"
text = "# The router controls host, port, API key, and alias. Do not set them here."
reason = "The llama.cpp preset format accepts these keys, but setting them breaks the router."

[[comment]]
path = "bin/pi-launcher.sh"
text = "# Default bridge network: the update needs internet only, not the compose services."
reason = "Moving the updater to sosho-net gives a network update step access to internal services."

[[comment]]
path = "tests/unit/test_configs.py"
text = "# The output is not printed. It can hold values from .env."
reason = "Printing the compose config output on failure leaks secret values into logs."

[[comment]]
path = "docker/Dockerfile.strata"
text = "# target-cpu=native builds the image for the CPU of the build host (i5-12400F, AVX2). Do not run it on another CPU."
reason = "The flag makes the binary fail with an illegal instruction on another CPU. The name does not show this."

[[comment]]
path = "run.sh"
text = "# Usage: ./run.sh [start|stop|status|logs|build]"
reason = "The script has no help flag. This line is the only place that lists the commands."

[[comment]]
path = "run.sh"
text = "# Never print the token."
reason = "A debug echo in load_token would leak the API token into the terminal and logs."
