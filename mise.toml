# mise pins every tool version for this repo. Run `mise install` to fetch them.
# Python tools (Ruff, Pyright, pytest) are pinned in pyproject.toml and run through uv.
# TypeScript tools (Biome, TypeScript, Vitest) are pinned in package.json and run through pnpm.
# Python 3.13 is the newest version that both LangGraph and Langflow list as supported.

[tools]
# Node comes from nvm and .nvmrc. Do not add node here.
pnpm = "12.21.0"
python = "3.13.18"
uv = "0.13.9"
lefthook = "2.2.2"
gitleaks = "8.30.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"
hadolint = "2.15.1"
taplo = "0.10.0"
vale = "3.27.0"

[settings]
pin = true

# Hooks run after `mise install`. They install dependencies and git hooks.
[hooks]
postinstall = "pnpm install && uv sync && lefthook install"
