[project]
name = "sosho"
version = "0.0.0"
description = "Sosho root project. Holds the shared Python tool configuration."
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv.workspace]
members = ["packages/engine", "packages/memory-graph"]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pyright==1.1.414",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pyyaml==6.0.4",
  "ruff==0.17.6",
  "sosho-engine==0.1.0",
  "sosho-memory==0.1.0",
  "tree-sitter-language-pack==1.9.1",
  "types-networkx==3.6.1.20261126",
]

[tool.uv.sources]
sosho-engine = { workspace = true }
sosho-memory = { workspace = true }

[tool.uv]
package = false
add-bounds = "exact"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
  "legacy",
  "packages/memory",
  "packages/yue2",
  ".pi",
  ".agents/skills",
  "models",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "RUF",
  "N",
  "S",
  "PT",
  "ANN",
  "C4",
  "ASYNC",
  "PIE",
  "RET",
  "TID",
  "PERF",
  "T20",
  "PL",
  "TRY",
]
ignore = ["PLR2004", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "ANN", "PLR2004"]
"**/tests/**" = ["S101", "ANN", "PLR2004"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["bin"]
exclude = [
  "**/node_modules",
  "**/.venv",
  "legacy",
  "packages/memory",
  "packages/yue2",
  ".pi",
  ".agents/skills",
  "models",
]

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov-context=test",
  "--cov-report=term-missing:skip-covered",
  "--durations=0",
  "--durations-min=0.05",
]
pythonpath = ["."]
markers = ["integration: needs a running service from make up"]
norecursedirs = [
  ".git",
  ".venv",
  "node_modules",
  "legacy",
  "packages/memory",
  "packages/yue2",
  ".pi",
  ".agents",
  "models",
]

[tool.coverage.run]
data_file = ".cache/coverage/.coverage"
source = [
  "packages/engine/src/sosho_engine",
  "packages/memory-graph/src/sosho_memory",
  "bin",
]
patch = ["subprocess"]
disable_warnings = ["no-data-collected"]
