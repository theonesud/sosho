# Root uv project. Shared Python tool configuration. The uv workspace holds packages/graph.
# Legacy code is excluded below: legacy/, the apps and workflows folders, and the
# packages that are pending review against docs/standards.

[project]
name = "sosho"
version = "0.0.0"
description = "Sosho root project. Holds the shared Python tool configuration."
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv.workspace]
members = ["packages/graph"]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pyright==1.1.414",
  "pytest==9.2.0",
  "pyyaml==6.0.4",
  "ruff==0.17.6",
  "sosho-graph",
]

[tool.uv.sources]
sosho-graph = { workspace = true }

[tool.uv]
package = false
add-bounds = "exact"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
  "legacy",
  "apps",
  "workflows",
  "packages/llm",
  "packages/memory",
  "packages/workflow-engine",
  "packages/yue2",
  ".pi",
  ".agents/skills",
  "models",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "RUF",
  "N",
  "S",
  "PT",
  "ANN",
  "C4",
  "ASYNC",
  "PIE",
  "RET",
  "TID",
  "PERF",
  "T20",
  "PL",
  "TRY",
]
ignore = [
  "PLR2004", # Magic values in comparisons are common and clear.
  "TRY003",  # Long messages in exception calls are acceptable.
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "ANN", "PLR2004"]
"**/tests/**" = ["S101", "ANN", "PLR2004"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
exclude = [
  "**/node_modules",
  "**/.venv",
  "legacy",
  "apps",
  "workflows",
  "packages/llm",
  "packages/memory",
  "packages/workflow-engine",
  "packages/yue2",
  ".pi",
  ".agents/skills",
  "models",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["."]
markers = [
  "integration: needs a running service from make up",
  "cloud: sends a request to a cloud model. Runs only with CLOUD=1",
  "heavy: loads the large GPU model. Runs only with HEAVY=1",
]
norecursedirs = [
  ".git",
  ".venv",
  "node_modules",
  "legacy",
  "apps",
  "workflows",
  "packages/llm",
  "packages/memory",
  "packages/workflow-engine",
  "packages/yue2",
  ".pi",
  ".agents",
  "models",
]
