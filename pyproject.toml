# Root uv project. Python packages join the workspace in stage 5.
# Legacy paths (yue2, apps, packages, tests, and others) are excluded below.
# The rebuild stages remove them from the exclude lists.

[project]
name = "sosho"
version = "0.0.0"
description = "Sosho root project. Holds the shared Python tool configuration."
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = ["pyright==1.1.414", "pytest==9.2.0", "ruff==0.17.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
  "apps",
  "packages",
  "yue2",
  "workflows",
  "tests",
  "docker",
  ".pi",
  ".agents/skills",
  ".impeccable",
  "models",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "RUF",
  "N",
  "S",
  "PT",
  "ANN",
  "C4",
  "ASYNC",
  "PIE",
  "RET",
  "TID",
  "PERF",
  "T20",
  "PL",
  "TRY",
]
ignore = [
  "PLR2004", # Magic values in comparisons are common and clear.
  "TRY003",  # Long messages in exception calls are acceptable.
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "ANN", "PLR2004"]
"**/tests/**" = ["S101", "ANN", "PLR2004"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
exclude = [
  "**/node_modules",
  "**/.venv",
  "apps",
  "packages",
  "yue2",
  "workflows",
  "tests",
  "docker",
  ".pi",
  ".agents/skills",
  ".impeccable",
  "models",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
norecursedirs = [
  ".git",
  ".venv",
  "node_modules",
  "apps",
  "packages",
  "yue2",
  "workflows",
  "tests",
  "docker",
  ".pi",
  ".agents",
  ".impeccable",
  "models",
]
