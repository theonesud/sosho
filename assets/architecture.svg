<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="1120" height="680" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ec4899"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1120" height="680" rx="20" fill="url(#bg)"/>
  <!-- Subtle grid dots -->
  <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#1e293b"/>
  </pattern>
  <rect width="1120" height="680" rx="20" fill="url(#dots)" opacity="0.7"/>

  <!-- Header -->
  <text x="560" y="46" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.3">How Sosho Works</text>
  <text x="560" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Private-first AI studio combining visual workflows, human approvals, self-improving memory, and smart cost routing</text>

  <!-- LAYER 1: HOW YOU INTERACT -->
  <text x="56" y="106" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.4">1. HOW YOU INTERACT</text>
  <g filter="url(#shadow)">
    <rect x="56" y="118" width="484" height="86" rx="14" fill="url(#cardBlue)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="56" y="118" width="484" height="4" rx="2" fill="url(#accentBlue)"/>
    <text x="80" y="150" fill="#f8fafc" font-size="15" font-weight="700">Visual Workflow Studio</text>
    <text x="80" y="172" fill="#94a3b8" font-size="12.5">Design multi-step AI workflows visually, watch live progress,</text>
    <text x="80" y="190" fill="#94a3b8" font-size="12.5">and review or edit outputs from one dashboard.</text>

    <rect x="580" y="118" width="484" height="86" rx="14" fill="url(#cardBlue)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="580" y="118" width="484" height="4" rx="2" fill="url(#accentBlue)"/>
    <text x="604" y="150" fill="#f8fafc" font-size="15" font-weight="700">Personal AI Assistant</text>
    <text x="604" y="172" fill="#94a3b8" font-size="12.5">Chat or run autonomous tasks in any project folder with</text>
    <text x="604" y="190" fill="#94a3b8" font-size="12.5">built-in research, coding, and browser skills.</text>
  </g>

  <!-- Arrows Layer 1 -> Layer 2 -->
  <line x1="298" y1="204" x2="298" y2="250" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="822" y1="204" x2="822" y2="250" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- LAYER 2: RELIABLE WORKFLOW & APPROVAL ENGINE -->
  <text x="56" y="244" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="1.4">2. RELIABLE WORKFLOW &amp; APPROVAL ENGINE</text>
  <g filter="url(#shadow)">
    <rect x="56" y="256" width="648" height="106" rx="14" fill="url(#cardBlue)" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="56" y="256" width="648" height="4" rx="2" fill="url(#accentPurple)"/>
    <text x="80" y="290" fill="#f8fafc" font-size="16" font-weight="700">AI Coordinator &amp; Specialist Team</text>
    <text x="80" y="314" fill="#cbd5e1" font-size="12.5">Breaks complex goals into reliable steps, delegates parallel work to cost-effective</text>
    <text x="80" y="334" fill="#cbd5e1" font-size="12.5">specialists, and automatically recovers from interruptions without losing progress.</text>

    <!-- Human Approval Checkpoint Card -->
    <rect x="744" y="256" width="320" height="106" rx="14" fill="url(#cardBlue)" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="744" y="256" width="320" height="4" rx="2" fill="url(#accentAmber)"/>
    <text x="768" y="290" fill="#fde68a" font-size="15" font-weight="700">Human Checkpoints</text>
    <text x="768" y="314" fill="#cbd5e1" font-size="12.5">Pauses before critical actions so</text>
    <text x="768" y="334" fill="#cbd5e1" font-size="12.5">you can approve, edit, or redirect.</text>
  </g>
  <!-- Bidirectional arrow Coordinator <-> Checkpoints -->
  <line x1="704" y1="309" x2="740" y2="309" stroke="#f59e0b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Arrows Layer 2 -> Layer 3 -->
  <line x1="210" y1="362" x2="210" y2="410" stroke="#ec4899" stroke-width="2" marker-start="url(#arrowPink)" marker-end="url(#arrowPink)"/>
  <line x1="560" y1="362" x2="560" y2="410" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="904" y1="362" x2="904" y2="410" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LAYER 3: THREE PILLARS -->
  <!-- Pillar A: Self-Improving Memory -->
  <text x="56" y="404" fill="#f472b6" font-size="11" font-weight="700" letter-spacing="1.4">3. SELF-IMPROVING MEMORY</text>
  <g filter="url(#shadow)">
    <rect x="56" y="416" width="324" height="164" rx="14" fill="url(#cardBlue)" stroke="#ec4899" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="74" y="434" width="288" height="58" rx="10" fill="#1e1b2e" stroke="#ec4899" stroke-opacity="0.3"/>
    <text x="90" y="458" fill="#f8fafc" font-size="13.5" font-weight="700">Personal &amp; Global Memory</text>
    <text x="90" y="478" fill="#94a3b8" font-size="11.5">Remembers your preferences, goals &amp; habits</text>

    <rect x="74" y="506" width="288" height="58" rx="10" fill="#1e1b2e" stroke="#ec4899" stroke-opacity="0.3"/>
    <text x="90" y="530" fill="#f8fafc" font-size="13.5" font-weight="700">Project Knowledge Base</text>
    <text x="90" y="550" fill="#94a3b8" font-size="11.5">Learns from every completed task &amp; decision</text>
  </g>

  <!-- Pillar B: Smart Cost & Privacy Routing -->
  <text x="404" y="404" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1.4">4. SMART COST &amp; PRIVACY ROUTING</text>
  <g filter="url(#shadow)">
    <rect x="404" y="416" width="368" height="164" rx="14" fill="url(#cardBlue)" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="422" y="432" width="332" height="40" rx="8" fill="#0f2922" stroke="#10b981" stroke-opacity="0.35"/>
    <text x="438" y="456" fill="#ecfdf5" font-size="12.5" font-weight="600">Instant Local Router</text>
    <text x="738" y="456" text-anchor="end" fill="#6ee7b7" font-size="11">Free · On-Device</text>

    <rect x="422" y="480" width="332" height="40" rx="8" fill="#172554" stroke="#3b82f6" stroke-opacity="0.4"/>
    <text x="438" y="504" fill="#eff6ff" font-size="12.5" font-weight="600">Cloud Intelligence</text>
    <text x="738" y="504" text-anchor="end" fill="#93c5fd" font-size="11">Complex Reasoning</text>

    <rect x="422" y="528" width="332" height="40" rx="8" fill="#2e1065" stroke="#a855f7" stroke-opacity="0.4"/>
    <text x="438" y="552" fill="#faf5ff" font-size="12.5" font-weight="600">Private Local AI &amp; Media</text>
    <text x="738" y="552" text-anchor="end" fill="#d8b4fe" font-size="11">100% Private · Zero Cloud</text>
  </g>

  <!-- Pillar C: Full Audit & Cost Dashboard -->
  <text x="796" y="404" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.4">5. VISIBILITY &amp; CONTROL</text>
  <g filter="url(#shadow)">
    <rect x="796" y="416" width="268" height="164" rx="14" fill="url(#cardBlue)" stroke="#64748b" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="818" y="452" fill="#f8fafc" font-size="15" font-weight="700">Audit &amp; Cost Dashboard</text>
    <text x="818" y="478" fill="#94a3b8" font-size="12">• Every AI decision &amp; step logged</text>
    <text x="818" y="502" fill="#94a3b8" font-size="12">• Real-time token &amp; cost tracking</text>
    <text x="818" y="526" fill="#94a3b8" font-size="12">• Full history of memory changes</text>
    <text x="818" y="550" fill="#94a3b8" font-size="12">• 100% self-hosted on your machine</text>
  </g>

  <!-- Footer bar -->
  <rect x="56" y="608" width="1008" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="560" y="634" text-anchor="middle" fill="#94a3b8" font-size="12">
    Privacy-First Local Hardware  ·  Human-in-the-Loop Safety  ·  Continuous Learning Memory  ·  Zero Vendor Lock-In
  </text>
</svg>
