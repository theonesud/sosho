# llama.cpp router presets for the Sosho llama-cpp service.
# Format: https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md (section "Model presets").
# Each section name is the model id that API callers send in the "model" field.
# Keys are llama-server long flag names without leading dashes.
# Paths are container paths under /models, mounted read-only from ./models.
# The router controls host, port, API key, and alias. Do not set them here.

version = 1

# GPU chat model with multimodal projector. MoE experts stay in CPU RAM.
[Qwen3.6-35B-A3B]
model = /models/Qwen3.6-35B-A3B/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q5_K_P.gguf
mmproj = /models/Qwen3.6-35B-A3B/mmproj-Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-f16.gguf
cpu-moe = true
moe-cache-mib = 1536
load-mode = mlock
image-min-tokens = 1024
ctx-size = 65536
n-predict = -1
parallel = 1
threads = 8
threads-batch = 12
cache-type-k = q4_0
cache-type-v = q4_0
batch-size = 2048
ubatch-size = 512
cache-prompt = true
reasoning = on
reasoning-preserve = true
flash-attn = on
sleep-idle-seconds = 900

# CPU-only decision model.
[Qwen3-1.7B]
model = /models/Qwen3-1.7B/Qwen3-1.7B-Q4_K_M.gguf
n-gpu-layers = 0
ctx-size = 16384
parallel = 4
threads = 8
cache-prompt = true

# CPU-only embedding model. Serves POST /v1/embeddings.
[embeddinggemma]
model = /models/embeddinggemma-300M/embeddinggemma-300M-Q8_0.gguf
n-gpu-layers = 0
embedding = true
pooling = mean
ctx-size = 2048
parallel = 4
threads = 4
