# The router controls host, port, API key, and alias. Do not set them here.
version = 1

[Qwen3.6-35B-A3B]
model = /models/Qwen3.6-35B-A3B/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q5_K_P.gguf
mmproj = /models/Qwen3.6-35B-A3B/mmproj-Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-f16.gguf
moe-cache-mib = 1536
load-mode = mlock
image-min-tokens = 1024
ctx-size = 65536
n-predict = -1
parallel = 1
threads = 8
threads-batch = 12
cache-type-k = q4_0
cache-type-v = q4_0
batch-size = 2048
ubatch-size = 512
cache-prompt = true
reasoning = on
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
reasoning-preserve = true
flash-attn = on
checkpoint-min-step = 1024
ctx-checkpoints = 32
sleep-idle-seconds = 900

[Qwen3-1.7B]
model = /models/Qwen3-1.7B/Qwen3-1.7B-Q4_K_M.gguf
device = none
n-gpu-layers = 0
sleep-idle-seconds = 900
ctx-size = 16384
parallel = 4
threads = 8
cache-prompt = true
reasoning = off

[embeddinggemma]
model = /models/embeddinggemma-300M/embeddinggemma-300M-Q8_0.gguf
device = none
n-gpu-layers = 0
sleep-idle-seconds = 900
embedding = true
pooling = mean
ctx-size = 2048
parallel = 4
threads = 4
