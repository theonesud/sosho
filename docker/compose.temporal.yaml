# Lightweight Temporal Stack for Sosho Workflows & Memory Evolution
# Reuses the existing Postgres 17 instance from docker/compose.langfuse.yaml
# (no Elasticsearch, no Cassandra, no duplicate Postgres).
#
# Usage:
#   docker compose --profile workflow up -d
#   Temporal gRPC: 127.0.0.1:7233
#   Temporal UI:   http://127.0.0.1:8233

services:
  temporal:
    profiles: [workflow]
    image: temporalio/auto-setup:latest
    container_name: sosho-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:7233:7233"
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      SKIP_DEFAULT_NAMESPACE_CREATION: "false"
      DEFAULT_NAMESPACE: default
      DEFAULT_NAMESPACE_RETENTION: 7d
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  temporal-ui:
    profiles: [workflow]
    image: temporalio/ui:latest
    container_name: sosho-temporal-ui
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "127.0.0.1:8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:4100,http://127.0.0.1:4100
