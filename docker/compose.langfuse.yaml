name: sosho

services:
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.69.0
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    ports:
      - "127.0.0.1:3001:3000"
    networks: [sosho-net]
    environment: &langfuse-env
      NODE_OPTIONS: --max-old-space-size=1024
      DATABASE_URL: postgresql://${LANGFUSE_PG_USER:-postgres}:${LANGFUSE_PG_PASSWORD:?Run make setup to create it}@postgres:5432/${LANGFUSE_PG_DB:-postgres}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Run make setup to create it}
      SALT: ${LANGFUSE_SALT:?Run make setup to create it}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Run make setup to create it}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3001}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Run make setup to create it}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:?Run make setup to create it}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?Run make setup to create it}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_USER:-minio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?Run make setup to create it}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-local-org}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-Local}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-pi-agent}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-Pi-Agent}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Run make setup to create it}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Run make setup to create it}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@local.dev}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?Run make setup to create it}

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.69.0
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    networks: [sosho-net]
    environment:
      <<: *langfuse-env
      NODE_OPTIONS: --max-old-space-size=384

  clickhouse:
    image: clickhouse/clickhouse-server:25.12.11.4
    restart: unless-stopped
    mem_limit: 1280m
    networks: [sosho-net]
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Run make setup to create it}
    volumes:
      - langfuse_clickhouse:/var/lib/clickhouse
      - ./clickhouse-memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s

  minio:
    image: cgr.dev/chainguard/minio@sha256:d88920d6a50bd0b088223b688be3b76c63e6205dbe494437f67ba1240ea12880
    restart: unless-stopped
    mem_limit: 256m
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    networks: [sosho-net]
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_USER:-minio}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:?Run make setup to create it}
    ports:
      - "127.0.0.1:9090:9000"
    volumes:
      - langfuse_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 2s

  redis:
    image: redis@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    restart: unless-stopped
    mem_limit: 256m
    networks: [sosho-net]
    command: --requirepass ${LANGFUSE_REDIS_AUTH:?Run make setup to create it} --maxmemory 200mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${LANGFUSE_REDIS_AUTH:?Run make setup to create it}\" ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    restart: unless-stopped
    mem_limit: 512m
    networks: [sosho-net]
    environment:
      POSTGRES_USER: ${LANGFUSE_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${LANGFUSE_PG_PASSWORD:?Run make setup to create it}
      POSTGRES_DB: ${LANGFUSE_PG_DB:-postgres}
    volumes:
      - langfuse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_PG_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  sosho-net:
    name: sosho-net

volumes:
  langfuse_postgres:
  langfuse_clickhouse:
  langfuse_minio:
